[package]
name = "padloper"
version = "0.1.0"
edition = "2024"
# Floor set by edition 2024.
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false
description = "A minimalist sqlite-backed shell-history recorder and searcher."
repository = "https://github.com/eljpsm/padloper"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
nucleo-matcher = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
